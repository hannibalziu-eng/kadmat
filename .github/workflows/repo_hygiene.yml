name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository hygiene checks
        run: |
          chmod +x ./scripts/repo_hygiene_check.sh
          ./scripts/repo_hygiene_check.sh
