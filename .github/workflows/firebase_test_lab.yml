name: Firebase Test Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI .env placeholder
        run: touch .env

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test test/unit --coverage
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build App APK
        run: flutter build apk --debug

      - name: Build Test APK
        run: |
          cd android
          ./gradlew app:assembleDebugAndroidTest

      - name: Collect APK artifacts
        id: collect_apks
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tmp/apks

          APP_APK="build/app/outputs/flutter-apk/app-debug.apk"
          TEST_APK=""

          if [ ! -f "$APP_APK" ]; then
            echo "::error::App APK not found at $APP_APK"
            exit 1
          fi

          if [ -f build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]; then
            TEST_APK="build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          elif [ -f android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]; then
            TEST_APK="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          fi

          cp -f "$APP_APK" tmp/apks/app-debug.apk
          echo "app_apk=tmp/apks/app-debug.apk" >> "$GITHUB_OUTPUT"

          if [ -n "$TEST_APK" ]; then
            cp -f "$TEST_APK" tmp/apks/app-debug-androidTest.apk
            echo "test_apk=tmp/apks/app-debug-androidTest.apk" >> "$GITHUB_OUTPUT"
            echo "has_test_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::app-debug-androidTest.apk was not found after Gradle build. Firebase Test Lab upload will be skipped."
            echo "has_test_apk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload App APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.collect_apks.outputs.app_apk }}

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        if: steps.collect_apks.outputs.has_test_apk == 'true'
        with:
          name: app-debug-androidTest
          path: ${{ steps.collect_apks.outputs.test_apk }}

      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: github.ref == 'refs/heads/main' && env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab
        if: github.ref == 'refs/heads/main' && env.GCP_SA_KEY != '' && steps.collect_apks.outputs.has_test_apk == 'true'
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app "${{ steps.collect_apks.outputs.app_apk }}" \
            --test "${{ steps.collect_apks.outputs.test_apk }}" \
            --device model=Pixel5,version=30,locale=en,orientation=portrait \
            --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
            --timeout 15m \
            --project="${GCP_PROJECT_ID:-lykadmat}" \
            --results-bucket=gs://test-lab-kadmat \
            --results-dir=test-results-${{ github.run_id }}
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
