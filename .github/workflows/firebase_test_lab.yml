name: Firebase Test Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.30.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit --coverage
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Build App APK
        run: flutter build apk --debug

      - name: Build Test APK
        run: |
          cd android
          ./gradlew app:assembleDebugAndroidTest

      - name: Upload App APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-androidTest
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: github.ref == 'refs/heads/main' && env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab
        if: github.ref == 'refs/heads/main' && env.GCP_SA_KEY != ''
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/flutter-apk/app-debug.apk \
            --test android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=Pixel5,version=30,locale=en,orientation=portrait \
            --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
            --timeout 15m \
            --project="${GCP_PROJECT_ID:-lykadmat}" \
            --results-bucket=gs://test-lab-kadmat \
            --results-dir=test-results-${{ github.run_id }}
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
