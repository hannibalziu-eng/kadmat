name: Accept Offer Contract Audit

on:
  push:
    branches: [main]
    paths:
      - "backend/migrations/22_add_jobs_accepted_bid_id.sql"
      - "backend/migrations/23_create_update_user_location_rpc.sql"
      - "backend/migrations/24_accept_job_offer_atomic_rpc.sql"
      - "backend/migrations/25_offer_acceptance_on_the_way_and_locks.sql"
      - "backend/src/services/jobService.js"
      - "backend/src/controllers/jobController.js"
      - "backend/scripts/audit-offer-acceptance-contract.js"
      - "backend/package.json"
      - ".github/workflows/accept_offer_contract_audit.yml"
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  audit-accept-offer-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "HAS_SUPABASE_SECRETS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SUPABASE_SECRETS=false" >> "$GITHUB_ENV"
            echo "::warning::Skipping accept-offer audit because SUPABASE secrets are missing."
          fi

      - name: Use Node.js 18.x
        if: env.HAS_SUPABASE_SECRETS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm ci

      - name: Run accept-offer contract audit
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm run audit:accept-offer-contract
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Skip audit (no secrets)
        if: env.HAS_SUPABASE_SECRETS != 'true'
        run: 'echo "Accept-offer contract audit skipped: missing SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY."'
