name: RPC Audit

on:
  push:
    branches: [main]
    paths:
      - "backend/migrations/**"
      - "backend/sql/rpc/**"
      - "backend/scripts/**"
      - ".github/workflows/rpc_audit.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  audit-get-nearby-jobs-rpc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "HAS_SUPABASE_SECRETS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SUPABASE_SECRETS=false" >> "$GITHUB_ENV"
            echo "::warning::Skipping RPC audit because SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not configured."
          fi

      - name: Use Node.js 18.x
        if: env.HAS_SUPABASE_SECRETS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm ci

      - name: Run RPC audit
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm run audit:rpc
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Skip RPC audit when secrets are missing
        if: env.HAS_SUPABASE_SECRETS != 'true'
        run: 'echo "RPC audit skipped: missing SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY."'
