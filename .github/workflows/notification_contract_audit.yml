name: Notification Contract Audit

on:
  push:
    branches: [main]
    paths:
      - "backend/migrations/26_notification_segmentation_contract.sql"
      - "backend/migrations/27_backfill_notification_audience_and_category.sql"
      - "backend/src/constants/notificationContract.js"
      - "backend/src/services/notificationOrchestrator.js"
      - "backend/src/services/jobService.js"
      - "backend/src/services/jobSearchService.js"
      - "backend/src/jobs/jobExpiryScheduler.js"
      - "backend/src/controllers/notificationController.js"
      - "backend/scripts/audit-notification-contract.js"
      - "backend/package.json"
      - ".github/workflows/notification_contract_audit.yml"
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

jobs:
  audit-notification-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "HAS_SUPABASE_SECRETS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SUPABASE_SECRETS=false" >> "$GITHUB_ENV"
            echo "::warning::Skipping notification contract audit because SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not configured."
          fi

      - name: Use Node.js 18.x
        if: env.HAS_SUPABASE_SECRETS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm ci

      - name: Run notification contract audit
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm run audit:notification-contract
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Skip notification contract audit when secrets are missing
        if: env.HAS_SUPABASE_SECRETS != 'true'
        run: 'echo "Notification contract audit skipped: missing SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY."'
