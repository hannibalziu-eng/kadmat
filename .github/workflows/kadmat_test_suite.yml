name: Kadmat Test Suite

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit_and_widget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Run unit/core/features tests
        run: flutter test test/unit test/core test/features

  integration_smoke:
    runs-on: ubuntu-latest
    needs: unit_and_widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Run integration smoke tests (guarded)
        run: |
          flutter test integration_test/comprehensive_test.dart \
            --dart-define=KADMAT_E2E_ENABLED=false
          flutter test integration_test/auth_journey_test.dart \
            --dart-define=KADMAT_E2E_ENABLED=false
          flutter test integration_test/customer_journey_test.dart \
            --dart-define=KADMAT_E2E_ENABLED=false
          flutter test integration_test/technician_journey_test.dart \
            --dart-define=KADMAT_E2E_ENABLED=false

  build_android_test_apks:
    runs-on: ubuntu-latest
    needs: unit_and_widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build app APK + androidTest APK
        run: |
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
            -Ptarget=/home/runner/work/kadmat/kadmat/integration_test/comprehensive_test.dart

      - name: Collect APK artifacts
        run: |
          mkdir -p tmp/apks
          if [ -f build/app/outputs/apk/debug/app-debug.apk ]; then
            cp -f build/app/outputs/apk/debug/app-debug.apk tmp/apks/
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp -f android/app/build/outputs/apk/debug/app-debug.apk tmp/apks/
          else
            echo "app-debug.apk not found"
            exit 1
          fi

          if [ -f build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]; then
            cp -f build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk tmp/apks/
          elif [ -f android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]; then
            cp -f android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk tmp/apks/
          else
            echo "app-debug-androidTest.apk not found"
            exit 1
          fi

          ls -lh tmp/apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kadmat-android-test-apks
          path: tmp/apks

  firebase_test_lab:
    runs-on: ubuntu-latest
    needs: build_android_test_apks
    if: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: kadmat-android-test-apks
          path: tmp/apks

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab instrumentation
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud firebase test android run \
            --type instrumentation \
            --app tmp/apks/app-debug.apk \
            --test tmp/apks/app-debug-androidTest.apk \
            --device model=redfin,version=30,locale=en,orientation=portrait \
            --device model=redfin,version=34,locale=en,orientation=portrait \
            --timeout=15m

