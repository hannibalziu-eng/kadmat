name: kadmat
description: "Kadmat - Service Marketplace Application"

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  # UI Framework
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # UI Enhancement
  flutter_scalify: ^1.0.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  
  # Maps & Location
  flutter_map: ^7.0.0
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  
  # Storage & Cache
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  
  # Networking
  dio: ^5.9.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^7.0.0
  
  # Auth & Backend
  supabase_flutter: ^2.8.0
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  
  # Image Handling
  image_picker: ^1.2.1
  flutter_image_compress: ^2.3.0
  
  # Utilities
  uuid: ^4.5.2
  local_auth: ^3.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Firebase (Optional - for FCM)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  
  # Quality & Testing
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  patrol: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true